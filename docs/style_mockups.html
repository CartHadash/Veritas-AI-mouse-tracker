<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style options</title>
<style>
  body { margin: 0; padding: 16px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #e9e9e9; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 16px; font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
  .card { border-radius: 14px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .label { font-size: 15px; font-weight: 700; padding: 10px 14px; background: #222; color: #fff; }
  .app { padding: 16px; }
  .app h2 { margin: 0 0 12px; font-size: 22px; }
  .banner { padding: 8px 10px; border-radius: 8px; font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .area { position: relative; height: 170px; border-radius: 12px; margin-bottom: 12px; }
  .target { position: absolute; width: 34px; height: 34px; border-radius: 50%; }
  .cur { position: absolute; width: 16px; height: 16px; border-radius: 50%; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .btn { font-size: 16px; padding: 12px 14px; border-radius: 10px; border: 2px solid; font-weight: 600; }
  .meter { display: flex; gap: 10px; align-items: center; font-size: 17px; margin-bottom: 10px; }
  .bar { flex: 1; height: 16px; border-radius: 8px; overflow: hidden; }
  .bar > div { height: 100%; width: 62%; }
  .foot { font-size: 14px; }

  /* A: calm and clinical */
  .a .app { background: #f7fafc; color: #102a43; }
  .a .banner { background: #fff4d6; color: #5c3c00; border: 2px solid #e0a800; }
  .a .area { background: #ffffff; border: 2px solid #9fb3c8; }
  .a .target { background: #2f6fb3; }
  .a .raw { background: rgba(214, 69, 65, .35); }
  .a .ok { background: #102a43; }
  .a .btn { background: #fff; border-color: #2f6fb3; color: #102a43; }
  .a .btn.on { background: #2f6fb3; color: #fff; }
  .a .bar { background: #d9e2ec; } .a .bar > div { background: #2f6fb3; }

  /* B: dark and technical */
  .b .app { background: #0f1419; color: #e6edf3; }
  .b .banner { background: #3a2a00; color: #ffd866; border: 2px solid #ffd866; }
  .b .area { background: #161b22; border: 2px solid #30363d; }
  .b .target { background: #2ea7ff; }
  .b .raw { background: rgba(255, 99, 99, .4); }
  .b .ok { background: #7ee787; }
  .b .btn { background: #161b22; border-color: #3fb950; color: #e6edf3; }
  .b .btn.on { background: #3fb950; color: #0f1419; }
  .b .bar { background: #30363d; } .b .bar > div { background: #2ea7ff; }

  /* C: warm and friendly */
  .c .app { background: #fff8f0; color: #3b2314; }
  .c .banner { background: #ffe1cc; color: #6b2c00; border: 2px solid #d9661a; }
  .c .area { background: #fffdf9; border: 2px solid #e8c9a8; }
  .c .target { background: #d9661a; }
  .c .raw { background: rgba(120, 120, 120, .35); }
  .c .ok { background: #3b2314; }
  .c .btn { background: #fff; border-color: #2e7d5b; color: #3b2314; border-radius: 22px; }
  .c .btn.on { background: #2e7d5b; color: #fff; }
  .c .bar { background: #f0dcc8; } .c .bar > div { background: #2e7d5b; }
</style>
</head>
<body>
<h1>Decision 6: which look for the demo page?</h1>
<p class="lead">Same layout in all three: practice area with targets, a faint "raw" cursor and a solid
"corrected" one, big mode buttons, the tremor meter, the demo-mode banner and the disclaimer.</p>
<div class="grid">
  <script>
    const styles = [["a", "A: Calm and clinical (light, blue)"], ["b", "B: Dark and technical"], ["c", "C: Warm and friendly (cream, green)"]];
    for (const [key, name] of styles) {
      document.write(`
      <div class="card ${key}">
        <div class="label">${name}</div>
        <div class="app">
          <h2>Steady pointer</h2>
          <div class="banner">Demo mode: replaying recorded tremor from a public dataset.</div>
          <div class="area">
            <div class="target" style="left:40px;top:30px"></div>
            <div class="target" style="left:220px;top:100px"></div>
            <div class="cur raw" style="left:150px;top:62px"></div>
            <div class="cur ok" style="left:162px;top:72px"></div>
          </div>
          <div class="buttons">
            <span class="btn">No filter</span><span class="btn">Lower sensitivity</span>
            <span class="btn">One Euro</span><span class="btn on">Our model</span>
          </div>
          <div class="meter"><b>Tremor</b><div class="bar"><div></div></div><span>4.9 Hz · 6 px</span></div>
          <div class="foot">This project is a prototype and is not medical advice.</div>
        </div>
      </div>`);
    }
  </script>
</div>
</body>
</html>
